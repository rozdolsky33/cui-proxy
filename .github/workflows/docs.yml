name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install documentation tools
        run: pip install -r requirements-docs.txt
      - name: Build CLI for executable documentation checks
        run: go build -o bin/cui-proxy ./cmd/cui-proxy
      - name: Verify embedded offline manual matches its sources
        run: go test ./internal/manual
      - name: Validate downloadable configurations and examples
        run: python scripts/check-docs.py --binary bin/cui-proxy
      - name: Build documentation and check links
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
