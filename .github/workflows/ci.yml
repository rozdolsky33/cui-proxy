name: ci

# Documentation-only changes do not run the Go matrix, fuzz smoke, or packaging
# jobs. The Documentation workflow still builds the site, rebuilds the CLI, and
# checks the embedded offline manual against docs/ on every change, so docs
# drift is caught there. Keep both paths-ignore lists identical.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/manual-assets/**'
      - 'mkdocs.yml'
      - 'mkdocs-offline.yml'
      - 'requirements-docs.txt'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/manual-assets/**'
      - 'mkdocs.yml'
      - 'mkdocs-offline.yml'
      - 'requirements-docs.txt'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: workflow harness regressions
        run: python3 -m unittest discover -s scripts/workflow
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: go test -race
        run: go test -race -count=1 -run . -bench '^BenchmarkAuditDurability$' -benchtime=4x ./...

      - name: mapping growth correctness smoke
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 6
        run: python3 scripts/workflow/churn_smoke.py
      - name: reachable vulnerability scan
        run: make vuln

      # Fuzz smoke: 20 s per target. A failure writes the input under
      # testdata/fuzz/; keep it as a seed once the bug is fixed.
      - name: fuzz FuzzSanitizeRequest
        run: go test -run '^$' -fuzz '^FuzzSanitizeRequest$' -fuzztime 20s ./internal/adapter/codex
      - name: fuzz FuzzSSERewrite
        run: go test -run '^$' -fuzz '^FuzzSSERewrite$' -fuzztime 20s ./internal/adapter/codex
      - name: fuzz FuzzArgumentJSON
        run: go test -run '^$' -fuzz '^FuzzArgumentJSON$' -fuzztime 20s ./internal/adapter/codex
      - name: fuzz FuzzRoundTrip
        run: go test -run '^$' -fuzz '^FuzzRoundTrip$' -fuzztime 20s ./internal/transform

      - name: upload fuzz failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ matrix.os }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  packaging:
    needs: test
    # Catches a broken installer or release build before a tag does.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh

      - name: build all release archives
        run: scripts/package.sh v0.0.0

      - name: the linux archive runs and passes its own checks
        run: |
          tmp=$(mktemp -d)
          tar -xzf dist/cui-proxy_0.0.0_linux_amd64.tar.gz -C "$tmp"
          "$tmp/cui-proxy" version
          "$tmp/cui-proxy" check-config -config "$tmp/examples/config.yaml"
          scripts/make-formula.sh v0.0.0 dist/checksums.txt | ruby -c

      - name: report-only benchmark comparison
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        timeout-minutes: 5
        env:
          BENCHMARK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GOTOOLCHAIN: local
        run: |
          python3 - <<'PYBENCH'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import signal
          import sys
          import tempfile
          sys.path.insert(0, "scripts/workflow")
          from benchmark_comparison import run_comparison
          from performance import prepare
          from performance_workload import Workload
          from performance_campaign import execute_command

          private = Path(tempfile.mkdtemp(prefix="cui-benchmark-", dir=os.environ["RUNNER_TEMP"]))
          report = Path(os.environ["RUNNER_TEMP"]) / "cui-benchmark-summary.json"
          base_tree = private / "base"
          root = Path.cwd()
          created = False
          code = 1

          def interrupted(signum, frame):
              raise KeyboardInterrupt
          signal.signal(signal.SIGTERM, interrupted)

          def capture(command, name):
              path = private / (name + ".log")
              if execute_command(command, path) != 0:
                  raise RuntimeError("benchmark_preparation_failed")
              return path.read_bytes()

          def harness(directory):
              files = {}
              for path in (directory / "internal/benchmark").rglob("*"):
                  if path.is_symlink():
                      raise ValueError("benchmark_harness_symlink")
                  if path.is_file():
                      files[path.relative_to(directory / "internal/benchmark").as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
              if not files:
                  raise ValueError("benchmark_harness_missing")
              return files

          try:
              base = os.environ["BENCHMARK_BASE_SHA"]
              if re.fullmatch(r"[0-9a-f]{40}", base) is None:
                  raise ValueError("benchmark_base_revision")
              candidate = capture(["git", "rev-parse", "HEAD"], "candidate-identity").decode().strip()
              if re.fullmatch(r"[0-9a-f]{40}", candidate) is None:
                  raise ValueError("benchmark_candidate_revision")
              capture(["git", "fetch", "--no-tags", "--depth=1", "origin", base], "fetch")
              capture(["git", "worktree", "add", "--detach", str(base_tree), base], "worktree")
              created = True
              if harness(root) != harness(base_tree):
                  report.write_text(json.dumps(dict(schema_version=1, report_only=True,
                      performance_qualified=False, status="unavailable", reason="benchmark_harness_changed",
                      base_commit=base, candidate_commit=candidate), indent=2))
                  print("benchmark comparison unavailable: harness changed")
              else:
                  base_binary = private / "base-bench"
                  candidate_binary = private / "candidate-bench"
                  capture(["go", "-C", str(base_tree), "test", "-c", "-o", str(base_binary), "./internal/benchmark"], "build-base")
                  capture(["go", "test", "-c", "-o", str(candidate_binary), "./internal/benchmark"], "build-candidate")
                  seed_binary = private / "seedvault"
                  capture(["go", "build", "-o", str(seed_binary), "./scripts/workflow/seedvault"], "build-seed")
                  fixtures = private / "fixtures"
                  fixtures.mkdir(mode=0o700)
                  workload = Workload()
                  prepare(fixtures, workload, str(seed_binary), 18080, 18081, "http://127.0.0.1:18082", 786432, False)
                  os.environ["CUI_BENCH_FIXTURE_DIR"] = str(fixtures)
                  result = run_comparison(base_binary, candidate_binary, base, candidate, report, private / "measurements")
                  metadata = workload.metadata()
                  result["workload"] = {key: metadata[key] for key in (
                      "generator_version", "seed", "regex_declarations", "dictionary_entries", "mapping_pairs")}
                  result["workload"]["size_bytes"] = 786432
                  report.write_text(json.dumps(result, allow_nan=False, sort_keys=True, indent=2))
                  print("benchmark comparison complete (report-only)")
              code = 0
          except KeyboardInterrupt:
              print("benchmark comparison interrupted; available evidence retained")
              code = 130
          except Exception:
              print("benchmark comparison failed; available evidence retained")
          finally:
              if created:
                  cleanup = execute_command(["git", "worktree", "remove", str(base_tree)], private / "cleanup.log")
                  if cleanup != 0:
                      print("benchmark workspace cleanup failed")
                      code = 1
          raise SystemExit(code)
          PYBENCH
      - name: upload numeric benchmark comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: ${{ runner.temp }}/cui-benchmark-summary.json
          if-no-files-found: ignore
          retention-days: 7
