name: ci

# Documentation-only changes do not run the Go matrix, fuzz smoke, or packaging
# jobs. The Documentation workflow still builds the site, rebuilds the CLI, and
# checks the embedded offline manual against docs/ on every change, so docs
# drift is caught there. Keep both paths-ignore lists identical.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/manual-assets/**'
      - 'mkdocs.yml'
      - 'mkdocs-offline.yml'
      - 'requirements-docs.txt'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/manual-assets/**'
      - 'mkdocs.yml'
      - 'mkdocs-offline.yml'
      - 'requirements-docs.txt'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: workflow harness regressions
        run: python3 -m unittest discover -s scripts/workflow
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: go test -race
        run: go test -race -count=1 -run . -bench '^BenchmarkAuditDurability$' -benchtime=4x ./...

      - name: mapping growth correctness smoke
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 6
        run: python3 scripts/workflow/churn_smoke.py
      - name: reachable vulnerability scan
        run: make vuln

      # Fuzz smoke: 20 s per target. A failure writes the input under
      # testdata/fuzz/; keep it as a seed once the bug is fixed.
      - name: fuzz FuzzSanitizeRequest
        run: go test -run '^$' -fuzz '^FuzzSanitizeRequest$' -fuzztime 20s ./internal/adapter/codex
      - name: fuzz FuzzSSERewrite
        run: go test -run '^$' -fuzz '^FuzzSSERewrite$' -fuzztime 20s ./internal/adapter/codex
      - name: fuzz FuzzArgumentJSON
        run: go test -run '^$' -fuzz '^FuzzArgumentJSON$' -fuzztime 20s ./internal/adapter/codex
      - name: fuzz FuzzRoundTrip
        run: go test -run '^$' -fuzz '^FuzzRoundTrip$' -fuzztime 20s ./internal/transform

      - name: upload fuzz failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ matrix.os }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  packaging:
    needs: test
    # Catches a broken installer or release build before a tag does.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh

      - name: build all release archives
        run: scripts/package.sh v0.0.0

      - name: the linux archive runs and passes its own checks
        run: |
          tmp=$(mktemp -d)
          tar -xzf dist/cui-proxy_0.0.0_linux_amd64.tar.gz -C "$tmp"
          "$tmp/cui-proxy" version
          "$tmp/cui-proxy" check-config -config "$tmp/examples/config.yaml"
          scripts/make-formula.sh v0.0.0 dist/checksums.txt | ruby -c
