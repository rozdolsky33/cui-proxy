# cui-proxy example config. Validate with: cui-proxy check-config -config examples/config.yaml
# Relative paths (dictionary files, vault files) resolve against this file's directory.

listen: 127.0.0.1:8787          # point Codex at http://127.0.0.1:8787/v1
ui:
  listen: 127.0.0.1:8788        # dashboard: http://127.0.0.1:8788/

upstreams:
  codex: https://chatgpt.com/backend-api/codex   # ChatGPT-login Codex backend

policy:
  # sanitize: detected values are masked with synthetic ones and restored in
  #           the reply (nothing is refused unless a rule says action: block).
  # strict:   ANY detection blocks the whole request before it is forwarded.
  #           Use this where a policy forbids sending restricted data at all:
  #           cui-proxy policy init --profile strict
  profile: sanitize
  on_error: block               # block (fail closed) | passthrough (UNSAFE; not allowed with strict)
  max_body_bytes: 20971520      # 20 MiB, as an integer
  # unsupported: block          # content the proxy cannot inspect (images, files, compressed
  #                             # bodies, unknown routes, oversized or unparseable bodies) is
  #                             # always refused; block is the only value

vault:
  mode: memory                  # memory | file
  # Encrypted file vault (mappings survive restarts). "~" is not expanded:
  # use absolute paths or paths relative to this file.
  # mode: file
  # key_file: /Users/you/.config/cui-proxy/vault.key   # created 0600 on first run
  # file: /Users/you/.config/cui-proxy/vault.bin

rules:
  # The v1 detector set: OCIDs, IPv4/IPv6/CIDR, emails, SSNs, card numbers,
  # bearer tokens, JWTs and private-key blocks.
  - name: builtin
    type: builtin

  # Your own sensitive names, one per line, in hosts.txt.
  # Any rule may set  action: block  to refuse a request that matches it even
  # under the sanitize profile. Under strict every rule blocks, and a rule
  # may not weaken that.
  - name: customer-hosts
    type: dictionary
    file: hosts.txt
    synth: hostname

  # AWS access key ids (long-term AKIA..., temporary ASIA...). The builtin
  # set has no AWS key detector.
  - name: aws-keys
    type: regex
    pattern: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    synth: secret

  # A regex rule example:
  # - name: ticket-ids
  #   type: regex
  #   pattern: 'CUI-[0-9]{6}'
  #   synth: secret
